<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Tab Groups</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Smart Tab Groups</h1>
      <p class="subtitle">Organize your tabs automatically</p>
    </header>

    <!-- Tab Navigation -->
    <nav class="tab-nav">
      <button id="nav-propose" class="nav-btn active">Propose Groups</button>
      <button id="nav-manage" class="nav-btn">Manage Active</button>
    </nav>

    <!-- Search & Filter Section -->
    <section class="search-filter-section">
      <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search tabs by title or URL..." />
        <button id="clear-search-btn" class="clear-search-btn hidden">✕</button>
      </div>
      <div class="filter-container">
        <label for="category-filter">Filter:</label>
        <select id="category-filter">
          <option value="all">All Categories</option>
        </select>
      </div>
    </section>

    <!-- Controls Section (only for Propose) -->
    <section id="propose-controls" class="controls">
      <div class="control-group">
        <label for="grouping-strategy">Grouping Strategy:</label>
        <select id="grouping-strategy">
          <option value="mixed">Mixed (Domain + Keywords)</option>
          <option value="domain">By Domain Only</option>
          <option value="keywords">By Keywords Only</option>
        </select>
      </div>

      <div class="control-group">
        <label class="checkbox-label">
          <input type="checkbox" id="auto-collapse" checked>
          <span>Auto-collapse inactive groups</span>
        </label>
      </div>
    </section>

    <!-- Loading State -->
    <div id="loading" class="loading-state hidden">
      <div class="spinner"></div>
      <p>Analyzing tabs...</p>
    </div>

    <!-- Preview Section -->
    <section id="propose-section" class="preview-section">
      <div class="preview-header">
        <h2>Proposed Groups</h2>
        <span id="tab-count" class="tab-count">0 tabs</span>
      </div>

      <div id="groups-container" class="groups-container">
        <!-- Groups will be dynamically inserted here -->
      </div>

      <div id="no-tabs-message" class="no-tabs-message hidden">
        <p>No tabs found to group</p>
      </div>
    </section>

    <!-- Manage Section -->
    <section id="manage-section" class="preview-section hidden">
      <div class="preview-header">
        <h2>Active Groups & Tabs</h2>
        <div class="manage-header-actions">
          <button id="fix-unnamed-btn" class="btn-text" title="Fix unnamed saved groups in bookmarks bar">🔧 Fix Unnamed</button>
          <button id="clean-bookmarks-btn" class="btn-text" title="Clean saved groups from bookmarks bar">🧹 Clean Bookmarks</button>
          <button id="ungroup-all-btn" class="btn-text">Ungroup All</button>
        </div>
      </div>

      <div id="active-groups-container" class="groups-container">
        <!-- Active groups and tabs will be inserted here -->
      </div>

      <div id="no-active-groups-message" class="no-tabs-message hidden">
        <p>No active tab groups found</p>
      </div>

      <div class="ungrouped-section">
        <h3>Ungrouped Tabs</h3>
        <div id="ungrouped-tabs-container" class="ungrouped-tabs-container">
          <!-- Ungrouped tabs will be inserted here -->
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <footer class="actions">
      <button id="refresh-btn" class="btn btn-secondary">
        <span class="btn-icon">🔄</span>
        Refresh
      </button>
      <button id="edit-rules-btn" class="btn btn-secondary">
        <span class="btn-icon">✏️</span>
        Settings
      </button>
      <button id="apply-btn" class="btn btn-primary">
        <span class="btn-icon">✅</span>
        Apply Proposals
      </button>
    </footer>

    <!-- Status Message -->
    <div id="status-message" class="status-message hidden"></div>
  </div>

  <script src="../content/domainClassifier.js"></script>
  <script src="../content/tabAnalyzer.js"></script>
  <script src="../content/learningEngine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
